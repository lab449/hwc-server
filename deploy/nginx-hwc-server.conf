# Production site: /etc/nginx/sites-available/hwc-server
# HTTP is available to all clients; HTTPS remains available.
# Certbot certificate files must already exist before enabling this site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dss.hdu.vedyakov.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name dss.hdu.vedyakov.com;
    ssl_certificate /etc/letsencrypt/live/dss.hdu.vedyakov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dss.hdu.vedyakov.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
